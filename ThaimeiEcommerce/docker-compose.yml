services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: thaimei
      MYSQL_USER: thaimei
      MYSQL_PASSWORD: thaimei_local_password
      MYSQL_ROOT_PASSWORD: thaimei_root_password
    ports:
      - "3306:3306"
    volumes:
      - thaimei-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pthaimei_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATASOURCE_URL: jdbc:mysql://database:3306/thaimei?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  thaimei-mysql:
